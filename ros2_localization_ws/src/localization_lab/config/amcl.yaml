# Nav2 AMCL — the reference benchmark, configured with the same models and
# parameters our MCL uses (likelihood field, Nav2 default noise, 60 beams).
amcl:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    map_topic: map
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    laser_model_type: likelihood_field
    laser_min_range: 0.12
    laser_max_range: 3.5
    max_beams: 60
    z_hit: 0.5
    z_short: 0.05
    z_max: 0.05
    z_rand: 0.5
    sigma_hit: 0.2
    laser_likelihood_max_dist: 2.0
    min_particles: 500
    max_particles: 2000
    update_min_d: 0.1
    update_min_a: 0.15
    resample_interval: 1
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    transform_tolerance: 0.5
    tf_broadcast: true
    set_initial_pose: true
    initial_pose: {x: 0.0, y: 0.0, z: 0.0, yaw: 0.0}
